<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argentina Street View Lab</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 850px;
  margin: 20px auto;
  padding: 14px;
  background: #f3f5f7;
  color: #222;
}
.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px #0000000a;
}
button {
  padding: 11px 14px;
  border: 0;
  border-radius: 7px;
  background: #1769d2;
  color: white;
  font-size: 15px;
  margin: 5px 3px 5px 0;
}
.secondary { background: #43845b; }
.danger { background: #a94747; }
input {
  padding: 10px;
  width: 100%;
  max-width: 300px;
  box-sizing: border-box;
  margin: 8px 0;
}
#status, #results {
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.note {
  color: #666;
  font-size: 13px;
  line-height: 1.6;
}
a { color: #1769d2; }
</style>
</head>

<body>

<div class="card">
  <h1>🇦🇷 Argentina Street View Lab</h1>
  <p>阿根廷随机街景抽样实验室</p>
  <p>目标：研究 Google 街景覆盖条件下，各地区被随机抽中的概率。</p>
</div>

<div class="card">
  <h2>1. 抽样设置</h2>

  <label for="count">本次抽样数量：</label><br>
  <input id="count" type="number" min="1" max="1000" value="10">

  <br>

  <button id="startButton" onclick="startSampling()">
    开始抽样
  </button>

  <button class="secondary" onclick="openLatest()">
    打开最新街景
  </button>

  <button class="secondary" onclick="exportCSV()">
    导出 CSV
  </button>

  <button class="secondary" onclick="exportJSON()">
    导出 JSON
  </button>

  <button class="danger" onclick="clearData()">
    清除记录
  </button>

  <p id="status">正在初始化抽样程序……</p>

  <p id="latest"></p>

  <p class="note">
    每次最多生成 1000 个位置。建议先测试 5—10 个，
    确认程序正常后再进行大规模抽样。
    生成坐标不代表已经人工检查过该处街景。
  </p>
</div>

<div class="card">
  <h2>2. 抽样统计</h2>
  <p>累计记录：<strong id="total">0</strong></p>
  <div id="results">暂无记录</div>
</div>

<script type="module">
import randomStreetView from
  "https://esm.sh/random-streetview";

const STORAGE_KEY = "argentinaSamples";
const COUNTRY_URL =
  "https://raw.githubusercontent.com/glynnbird/countriesgeojson/master/argentina.geojson";

let records = [];
let samplerReady = false;
let sampling = false;
let latestRecord = null;

try {
  const stored = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );
  if (Array.isArray(stored)) records = stored;
} catch (error) {
  records = [];
}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function saveData() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(records)
    );
  } catch (error) {
    setStatus(
      "浏览器存储失败。请先导出 JSON 备份记录。"
    );
  }
}

function render() {
  document.getElementById("total").textContent =
    records.length;

  const counts = {};

  for (const record of records) {
    const name = record.province || "尚未识别省份";
    counts[name] = (counts[name] || 0) + 1;
  }

  const results = document.getElementById("results");
  results.replaceChildren();

  if (!records.length) {
    results.textContent = "暂无记录";
    return;
  }

  Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .forEach(([name, count]) => {
      const p = document.createElement("p");
      p.textContent =
        `${name}：${count} 次（` +
        `${(count * 100 / records.length).toFixed(2)}%）`;
      results.appendChild(p);
    });

  const last = records[records.length - 1];
  latestRecord = last;

  const latest = document.getElementById("latest");
  latest.replaceChildren();

  if (Number.isFinite(last.lat) &&
      Number.isFinite(last.lng)) {
    const a = document.createElement("a");
    a.href = streetViewURL(last.lat, last.lng);
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent =
      `打开最新位置：${last.lat.toFixed(6)}, ` +
      `${last.lng.toFixed(6)}`;
    latest.appendChild(a);
  }
}

function streetViewURL(lat, lng) {
  return "https://www.google.com/maps/@?api=1" +
    "&map_action=pano&viewpoint=" + lat + "," + lng;
}

function getOuterRings(geometry) {
  if (!geometry) return [];

  if (geometry.type === "Polygon") {
    return geometry.coordinates.length
      ? [geometry.coordinates[0]]
      : [];
  }

  if (geometry.type === "MultiPolygon") {
    return geometry.coordinates
      .filter(polygon => polygon.length)
      .map(polygon => polygon[0]);
  }

  return [];
}

  setStatus("正在加载阿根廷国界数据……");

  const response = await fetch(COUNTRY_URL);
